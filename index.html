<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>铁巢重炮 · 射击诸元计算器</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            background: #1e1f22;
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 12px 8px 24px;
        }

        .app {
            max-width: 480px;
            width: 100%;
            background: #0b0c0e;
            border-radius: 28px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.8), 0 0 0 1px #3a3c42 inset;
            padding: 20px 16px 24px;
            color: #e6e8ee;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-align: center;
            color: #c0c6d4;
            margin-bottom: 16px;
            text-shadow: 0 2px 4px #00000080;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        h1 span {
            background: #2a2e36;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 400;
            color: #9aa2b3;
        }

        .mode-switch {
            display: flex;
            gap: 8px;
            margin-bottom: 18px;
            background: #13161b;
            padding: 6px;
            border-radius: 44px;
            border: 1px solid #2e323a;
        }

        .mode-btn {
            flex: 1;
            text-align: center;
            padding: 10px 0;
            border-radius: 36px;
            font-size: 1rem;
            font-weight: 600;
            color: #9aa2b3;
            background: transparent;
            border: none;
            transition: all 0.15s ease;
            cursor: pointer;
            touch-action: manipulation;
            letter-spacing: 0.5px;
        }

        .mode-btn.active {
            background: #3f4754;
            color: #f0f3fc;
            box-shadow: 0 4px 8px #00000050, 0 0 0 1px #6b778b inset;
        }

        /* 弹种选择行（现在在距离之前） */
        .ammo-row {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .ammo-select-wrapper {
            flex: 1;
            background: #13161b;
            border-radius: 48px;
            padding: 4px 4px 4px 20px;
            display: flex;
            align-items: center;
            border: 1px solid #2e323a;
            transition: border-color 0.2s;
        }

        .ammo-select-wrapper:focus-within {
            border-color: #5b6b84;
        }

        .ammo-select-wrapper label {
            font-size: 1rem;
            font-weight: 500;
            color: #8d96aa;
            margin-right: 8px;
            white-space: nowrap;
        }

        .ammo-select-wrapper select {
            flex: 1;
            background: transparent;
            border: none;
            padding: 14px 4px;
            font-size: 1.15rem;
            font-weight: 600;
            color: #f0f3fc;
            outline: none;
            min-width: 0;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238d96aa' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 8px center;
            background-size: 18px;
            padding-right: 32px;
        }

        .ammo-select-wrapper select option {
            background: #1e2229;
            color: #e6e8ee;
            padding: 8px;
        }

        .ammo-clear-btn {
            background: #282e38;
            border: none;
            border-radius: 40px;
            width: 56px;
            height: 56px;
            font-size: 1.2rem;
            color: #cdd6e6;
            font-weight: 400;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            touch-action: manipulation;
            transition: background 0.1s, transform 0.1s;
            margin-left: 4px;
            flex-shrink: 0;
            box-shadow: 0 2px 4px #00000040;
        }

        .ammo-clear-btn:active {
            background: #3b4351;
            transform: scale(0.94);
        }

        /* 距离输入区 */
        .input-block {
            background: #13161b;
            border-radius: 48px;
            padding: 4px 4px 4px 20px;
            display: flex;
            align-items: center;
            border: 1px solid #2e323a;
            margin-bottom: 12px;
            transition: border-color 0.2s;
        }

        .input-block:focus-within {
            border-color: #5b6b84;
        }

        .input-block label {
            font-size: 1rem;
            font-weight: 500;
            color: #8d96aa;
            margin-right: 8px;
            white-space: nowrap;
        }

        .input-block input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 14px 4px;
            font-size: 1.35rem;
            font-weight: 600;
            color: #f0f3fc;
            outline: none;
            min-width: 0;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.5px;
        }

        .input-block input::placeholder {
            color: #4a5262;
            font-weight: 400;
            font-size: 1rem;
        }

        .clear-btn {
            background: #282e38;
            border: none;
            border-radius: 40px;
            width: 56px;
            height: 56px;
            font-size: 1.6rem;
            color: #cdd6e6;
            font-weight: 400;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            touch-action: manipulation;
            transition: background 0.1s, transform 0.1s;
            margin-left: 4px;
            flex-shrink: 0;
            box-shadow: 0 2px 4px #00000040;
        }

        .clear-btn:active {
            background: #3b4351;
            transform: scale(0.94);
        }

        /* 装药 & 仰角 双卡片区（装药在左，仰角在右） */
        .stats-row {
            display: flex;
            gap: 10px;
            margin-bottom: 18px;
        }

        .stat-card {
            background: #1b1f27;
            border-radius: 24px;
            padding: 14px 16px;
            border: 1px solid #343b46;
            box-shadow: 0 6px 0 #0b0d10;
            flex: 1;
            min-width: 0;
        }

        .stat-label {
            font-size: 0.85rem;
            font-weight: 500;
            color: #8b95a8;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: #e7edff;
            line-height: 1.2;
            font-variant-numeric: tabular-nums;
            letter-spacing: 1px;
            display: flex;
            align-items: baseline;
            gap: 4px;
            white-space: nowrap;
        }

        .stat-value small {
            font-size: 0.9rem;
            font-weight: 400;
            color: #7f8b9f;
            margin-left: 2px;
        }

        /* 装药卡片高亮强调 */
        .charge-card {
            background: #1f2a1f;
            border: 1px solid #3e6b3e;
            box-shadow: 0 6px 0 #0a130a;
            position: relative;
        }

        .charge-card .stat-label {
            color: #9fdf9f;
        }

        .charge-card .stat-value {
            color: #d4ffd4;
            text-shadow: 0 0 12px #4a8f4a80;
        }

        .charge-card .stat-value small {
            color: #7db87d;
        }

        .charge-card .charge-number {
            font-size: 2.4rem;
            font-weight: 800;
            color: #e8ffe8;
            line-height: 1;
            letter-spacing: 1px;
            background: #2d4a2d;
            padding: 2px 12px;
            border-radius: 40px;
            display: inline-block;
            margin-left: 4px;
            box-shadow: 0 2px 0 #1a2e1a inset, 0 0 18px #5a9f5a30;
        }

        .detail-line {
            font-size: 0.9rem;
            color: #7a849b;
            text-align: right;
            margin-top: -8px;
            margin-bottom: 14px;
            padding-right: 6px;
            min-height: 1.2em;
        }

        .action-row {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .add-btn {
            flex: 1;
            background: #2d3440;
            border: none;
            border-radius: 60px;
            padding: 16px 0;
            font-size: 1.2rem;
            font-weight: 600;
            color: #ebf0ff;
            cursor: pointer;
            touch-action: manipulation;
            transition: background 0.1s, transform 0.1s;
            box-shadow: 0 4px 0 #0e1013;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            letter-spacing: 0.8px;
            border: 1px solid #4b5568;
        }

        .add-btn:active {
            background: #3b4453;
            transform: translateY(3px);
            box-shadow: 0 1px 0 #0e1013;
        }

        .add-btn:disabled {
            opacity: 0.45;
            transform: translateY(2px);
            box-shadow: 0 2px 0 #0e1013;
            pointer-events: none;
        }

        .records-title {
            font-size: 0.95rem;
            font-weight: 500;
            color: #7c869d;
            margin-bottom: 10px;
            padding-left: 6px;
            display: flex;
            justify-content: space-between;
        }

        .record-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 360px;
            overflow-y: auto;
            padding-right: 2px;
        }

        .record-item {
            background: #13171f;
            border-radius: 20px;
            padding: 12px 12px 12px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid #2f353f;
            box-shadow: 0 2px 0 #0a0c0f;
            transition: background 0.1s, opacity 0.2s;
        }

        .record-item.done-item {
            background: #101a10;
            border-color: #2f4a2f;
            opacity: 0.85;
        }

        .record-left {
            display: flex;
            align-items: baseline;
            gap: 10px;
            flex: 1;
            min-width: 0;
            flex-wrap: wrap;
        }

        .record-index {
            font-size: 0.85rem;
            font-weight: 600;
            color: #6f7a8f;
            background: #1f242e;
            padding: 4px 10px;
            border-radius: 40px;
            flex-shrink: 0;
        }

        .record-angle {
            font-size: 1.35rem;
            font-weight: 700;
            color: #dbe4ff;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        .record-angle small {
            font-size: 0.75rem;
            font-weight: 400;
            color: #7e8aa0;
            margin-left: 1px;
        }

        .record-charge-badge {
            font-size: 0.85rem;
            font-weight: 700;
            color: #b6f0b6;
            background: #1e361e;
            padding: 3px 12px;
            border-radius: 40px;
            border: 1px solid #3e6b3e;
            white-space: nowrap;
            box-shadow: 0 0 10px #3e6b3e40;
        }

        .record-ammo-badge {
            font-size: 0.85rem;
            font-weight: 700;
            color: #f0d6a6;
            background: #3a2e1a;
            padding: 3px 12px;
            border-radius: 40px;
            border: 1px solid #6b5a3e;
            white-space: nowrap;
            box-shadow: 0 0 10px #6b5a3e40;
        }

        .record-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
            margin-left: 8px;
        }

        .record-btn {
            background: #232a35;
            border: none;
            border-radius: 30px;
            padding: 8px 12px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #b7c1d6;
            cursor: pointer;
            touch-action: manipulation;
            transition: all 0.1s;
            border: 1px solid #3d4553;
            white-space: nowrap;
            box-shadow: 0 2px 0 #0b0d10;
        }

        .record-btn.done {
            color: #a7e0a7;
            border-color: #3e6b3e;
            background: #1c2b1c;
        }

        .record-btn.done:active {
            background: #2c3f2c;
        }

        .record-btn.delete {
            color: #f9b2b2;
            border-color: #7a3e3e;
            background: #2b1c1c;
        }

        .record-btn.delete:active {
            background: #3f2c2c;
        }

        .record-btn:active {
            transform: translateY(1px);
            box-shadow: 0 1px 0 #0b0d10;
        }

        .record-btn:disabled {
            opacity: 0.5;
            pointer-events: none;
            transform: none;
            box-shadow: 0 1px 0 #0b0d10;
        }

        .empty-records {
            color: #424b5c;
            font-size: 0.95rem;
            text-align: center;
            padding: 24px 0 16px;
            font-style: italic;
            letter-spacing: 0.3px;
        }

        /* 滚动条美化 */
        .record-list::-webkit-scrollbar {
            width: 4px;
        }

        .record-list::-webkit-scrollbar-track {
            background: #1b1f27;
            border-radius: 10px;
        }

        .record-list::-webkit-scrollbar-thumb {
            background: #3d4553;
            border-radius: 10px;
        }

        /* 手机小屏微调 */
        @media (max-width: 380px) {
            .stat-value {
                font-size: 1.7rem;
            }
            .charge-card .charge-number {
                font-size: 2rem;
                padding: 1px 8px;
            }
            .record-angle {
                font-size: 1.15rem;
            }
            .record-btn {
                padding: 6px 8px;
                font-size: 0.7rem;
            }
            .record-index {
                font-size: 0.75rem;
                padding: 3px 8px;
            }
            .ammo-select-wrapper {
                padding-left: 14px;
            }
            .ammo-select-wrapper label {
                font-size: 0.85rem;
                margin-right: 4px;
            }
            .ammo-select-wrapper select {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <h1>
            🎯 铁巢重炮
            <span>诸元</span>
        </h1>

        <!-- 模式切换 -->
        <div class="mode-switch">
            <button class="mode-btn active" data-mode="economy">节约射</button>
            <button class="mode-btn" data-mode="rapid">速射</button>
            <button class="mode-btn" data-mode="emergency">急射</button>
        </div>

        <!-- 弹种选择区（已移到距离前面） -->
        <div class="ammo-row">
            <div class="ammo-select-wrapper">
                <label>弹种</label>
                <select id="ammoSelect">
                    <option value="">— 无 —</option>
                    <option value="照明弹">照明弹</option>
                    <option value="高爆弹">高爆弹</option>
                    <option value="高装药高爆弹">高装药高爆弹</option>
                    <option value="轻型高爆弹">轻型高爆弹</option>
                    <option value="穿甲弹">穿甲弹</option>
                    <option value="穿甲高爆弹">穿甲高爆弹</option>
                    <option value="钻地弹">钻地弹</option>
                    <option value="燃烧弹">燃烧弹</option>
                    <option value="高温燃烧弹">高温燃烧弹</option>
                    <option value="烟雾弹">烟雾弹</option>
                    <option value="训练弹">训练弹</option>
                    <option value="催泪弹">催泪弹</option>
                    <option value="光气弹">光气弹</option>
                    <option value="芥气弹">芥气弹</option>
                    <option value="氰气弹">氰气弹</option>
                    <option value="白磷弹">白磷弹</option>
                    <option value="霰弹">霰弹</option>
                    <option value="延时集束弹">延时集束弹</option>
                    <option value="集束子母弹">集束子母弹</option>
                    <option value="宣传弹">宣传弹</option>
                    <option value="战术核炮弹">战术核炮弹</option>
                </select>
            </div>
            <button class="ammo-clear-btn" id="ammoClearBtn" aria-label="清除弹种">✕</button>
        </div>

        <!-- 距离输入区 -->
        <div class="input-block">
            <label>距离</label>
            <input type="text" id="distanceInput" inputmode="decimal" placeholder="公里" value="">
            <button class="clear-btn" id="clearBtn" aria-label="清除距离">✕</button>
        </div>

        <!-- 装药 & 仰角 双卡片（装药在左，仰角在右） -->
        <div class="stats-row">
            <div class="stat-card charge-card">
                <div class="stat-label">💥 装药</div>
                <div class="stat-value">
                    <span class="charge-number" id="chargeNumber">—</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-label">📐 仰角</div>
                <div class="stat-value" id="angleDisplay">0.00<small>°</small></div>
            </div>
        </div>
        <div class="detail-line" id="chargeDetail">等待输入…</div>

        <!-- 添加记录按钮 -->
        <div class="action-row">
            <button class="add-btn" id="addRecordBtn" disabled>
                <span>📋</span> 添加记录
            </button>
        </div>

        <!-- 记录列表 -->
        <div class="records-title">
            <span>射击记录</span>
            <span id="recordCount">0 条</span>
        </div>
        <ul class="record-list" id="recordList">
            <li class="empty-records">暂无记录</li>
        </ul>
    </div>

    <script>
        (function() {
            // ---------- 持久化存储键名 ----------
            const STORAGE_KEY = 'ironNest_records_v6';   // 版本升级：弹种顺序调整
            const STORAGE_SEQ_KEY = 'ironNest_seq_v6';

            // ---------- 状态 ----------
            let currentMode = 'economy';        // economy / rapid / emergency
            let currentDistance = null;         // 有效数字(公里)
            let currentAngle = null;            // 仰角数值(°)
            let currentCharge = null;           // 装药数
            let currentAmmo = '';               // 弹种名称
            let recordSeq = 0;                  // 用于序号自增
            let records = [];                   // 记录对象: { id, angle, charge, ammo, done }

            // DOM 元素
            const distanceInput = document.getElementById('distanceInput');
            const clearBtn = document.getElementById('clearBtn');
            const ammoSelect = document.getElementById('ammoSelect');
            const ammoClearBtn = document.getElementById('ammoClearBtn');
            const angleDisplay = document.getElementById('angleDisplay');
            const chargeNumber = document.getElementById('chargeNumber');
            const chargeDetail = document.getElementById('chargeDetail');
            const addRecordBtn = document.getElementById('addRecordBtn');
            const recordList = document.getElementById('recordList');
            const recordCount = document.getElementById('recordCount');
            const modeBtns = document.querySelectorAll('.mode-btn');

            // ---------- 持久化函数 ----------
            function saveRecords() {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
                    localStorage.setItem(STORAGE_SEQ_KEY, recordSeq.toString());
                } catch (e) {
                    console.warn('保存记录失败', e);
                }
            }

            function loadRecords() {
                try {
                    const storedRecords = localStorage.getItem(STORAGE_KEY);
                    const storedSeq = localStorage.getItem(STORAGE_SEQ_KEY);
                    if (storedRecords) {
                        records = JSON.parse(storedRecords);
                        records = records.map(r => ({
                            id: r.id,
                            angle: r.angle,
                            charge: r.charge !== undefined ? r.charge : 1,
                            ammo: r.ammo || '',
                            done: r.done === true
                        }));
                    } else {
                        records = [];
                    }
                    if (storedSeq) {
                        recordSeq = parseInt(storedSeq, 10) || 0;
                    } else {
                        if (records.length > 0) {
                            recordSeq = Math.max(...records.map(r => r.id), 0);
                        } else {
                            recordSeq = 0;
                        }
                    }
                    if (records.length > 0) {
                        const maxId = Math.max(...records.map(r => r.id));
                        if (recordSeq < maxId) recordSeq = maxId;
                    }
                } catch (e) {
                    console.warn('读取记录失败，重置', e);
                    records = [];
                    recordSeq = 0;
                }
            }

            // ---------- 工具函数 ----------
            function getCharge(mode, distance) {
                if (distance === null || isNaN(distance) || distance <= 0) return null;

                switch (mode) {
                    case 'economy':
                        if (distance > 0 && distance <= 5) return 1;
                        if (distance > 5 && distance <= 10) return 2;
                        if (distance > 10 && distance <= 15) return 3;
                        if (distance > 15 && distance <= 20) return 4;
                        if (distance > 20 && distance <= 25) return 5;
                        if (distance > 25 && distance <= 30) return 6;
                        return null;
                    case 'rapid':
                        if (distance > 0 && distance <= 0.5) return 1;
                        if (distance > 0.5 && distance <= 1.25) return 2;
                        if (distance > 1.25 && distance <= 2.5) return 3;
                        if (distance > 2.5 && distance <= 5) return 4;
                        if (distance > 5 && distance <= 12.5) return 5;
                        if (distance > 12.5 && distance <= 30) return 6;
                        return null;
                    case 'emergency':
                        if (distance > 0 && distance <= 2.5) return 3;
                        if (distance > 2.5 && distance <= 30) return 6;
                        return null;
                    default:
                        return null;
                }
            }

            function computeAngle(charge, distance) {
                if (charge === null || distance === null || distance <= 0) return null;
                let raw = (12 / charge) * distance;
                let limited = Math.min(raw, 60);
                return Math.round(limited * 100) / 100;
            }

            function formatAngle(angle) {
                if (angle === null) return '0.00';
                return angle.toFixed(2);
            }

            function refreshCalculation() {
                const rawInput = distanceInput.value.trim();
                let distance = null;
                if (rawInput !== '') {
                    distance = parseFloat(rawInput);
                    if (isNaN(distance) || distance <= 0) {
                        distance = null;
                    }
                }

                const charge = getCharge(currentMode, distance);
                let angle = null;

                if (distance !== null && charge !== null) {
                    angle = computeAngle(charge, distance);
                }

                angleDisplay.innerHTML = `${formatAngle(angle)}<small>°</small>`;

                if (charge !== null) {
                    chargeNumber.textContent = charge;
                } else {
                    chargeNumber.textContent = '—';
                }

                const ammoText = currentAmmo ? ` · ${currentAmmo}` : '';
                if (distance !== null && charge !== null && angle !== null) {
                    chargeDetail.textContent = `距离 ${distance.toFixed(2)} km  ·  装药 ${charge}${ammoText}`;
                } else if (rawInput === '') {
                    chargeDetail.textContent = '输入距离计算';
                } else if (distance === null) {
                    chargeDetail.textContent = '距离无效 (需 >0)';
                } else {
                    chargeDetail.textContent = '超出该模式射程';
                }

                const valid = (distance !== null && charge !== null && angle !== null);
                addRecordBtn.disabled = !valid;

                currentDistance = distance;
                currentCharge = charge;
                currentAngle = angle;
            }

            function renderRecords() {
                if (records.length === 0) {
                    recordList.innerHTML = '<li class="empty-records">暂无记录</li>';
                    recordCount.textContent = '0 条';
                    return;
                }

                let html = '';
                records.forEach(rec => {
                    const angleStr = rec.angle.toFixed(2);
                    const isDone = rec.done === true;
                    const itemClass = isDone ? 'record-item done-item' : 'record-item';
                    const chargeValue = rec.charge !== undefined ? rec.charge : '?';
                    const ammoValue = rec.ammo || '';
                    const doneBtnHtml = isDone
                        ? `<button class="record-btn done" data-action="done" data-id="${rec.id}" disabled>✓ 已完成</button>`
                        : `<button class="record-btn done" data-action="done" data-id="${rec.id}">完成</button>`;

                    // 弹种徽章放在装药前面
                    const ammoBadgeHtml = ammoValue ? `<span class="record-ammo-badge">${ammoValue}</span>` : '';

                    html += `
                        <li class="${itemClass}" data-id="${rec.id}">
                            <div class="record-left">
                                <span class="record-index">#${rec.id}</span>
                                ${ammoBadgeHtml}
                                <span class="record-charge-badge">装药 ${chargeValue}</span>
                                <span class="record-angle">${angleStr}<small>°</small></span>
                            </div>
                            <div class="record-actions">
                                ${doneBtnHtml}
                                <button class="record-btn delete" data-action="delete" data-id="${rec.id}">删除</button>
                            </div>
                        </li>
                    `;
                });
                recordList.innerHTML = html;
                recordCount.textContent = `${records.length} 条`;
            }

            function addRecord() {
                if (currentAngle === null || currentDistance === null || currentCharge === null) {
                    return;
                }
                recordSeq += 1;
                const newRecord = {
                    id: recordSeq,
                    angle: currentAngle,
                    charge: currentCharge,
                    ammo: currentAmmo,
                    done: false
                };
                records.push(newRecord);
                saveRecords();
                renderRecords();
            }

            function deleteRecord(id) {
                const index = records.findIndex(r => r.id === id);
                if (index !== -1) {
                    records.splice(index, 1);
                    saveRecords();
                    renderRecords();
                }
            }

            function markDone(id) {
                const record = records.find(r => r.id === id);
                if (record && !record.done) {
                    record.done = true;
                    saveRecords();
                    renderRecords();
                }
            }

            function clearInputAndFocus() {
                distanceInput.value = '';
                refreshCalculation();
                distanceInput.focus();
            }

            function clearAmmo() {
                ammoSelect.value = '';
                currentAmmo = '';
                refreshCalculation();
            }

            function setMode(mode) {
                currentMode = mode;
                modeBtns.forEach(btn => {
                    const m = btn.dataset.mode;
                    btn.classList.toggle('active', m === mode);
                });
                refreshCalculation();
            }

            // ---------- 事件绑定 ----------
            distanceInput.addEventListener('input', function() {
                refreshCalculation();
            });

            clearBtn.addEventListener('click', function(e) {
                e.preventDefault();
                clearInputAndFocus();
            });

            ammoSelect.addEventListener('change', function() {
                currentAmmo = this.value;
                refreshCalculation();
            });

            ammoClearBtn.addEventListener('click', function(e) {
                e.preventDefault();
                clearAmmo();
            });

            modeBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    const mode = this.dataset.mode;
                    if (mode) setMode(mode);
                });
            });

            addRecordBtn.addEventListener('click', function() {
                addRecord();
            });

            recordList.addEventListener('click', function(e) {
                const target = e.target.closest('.record-btn');
                if (!target) return;
                const action = target.dataset.action;
                const id = parseInt(target.dataset.id, 10);
                if (isNaN(id)) return;

                if (action === 'delete') {
                    deleteRecord(id);
                } else if (action === 'done') {
                    if (!target.disabled) {
                        markDone(id);
                    }
                }
            });

            // ---------- 初始化 ----------
            function init() {
                loadRecords();
                setMode('economy');
                distanceInput.value = '';
                ammoSelect.value = '';
                currentAmmo = '';
                refreshCalculation();
                renderRecords();
            }

            init();

            // 多标签同步
            window.addEventListener('storage', function(e) {
                if (e.key === STORAGE_KEY || e.key === STORAGE_SEQ_KEY) {
                    loadRecords();
                    renderRecords();
                }
            });

        })();
    </script>
</body>
</html>
